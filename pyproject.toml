[project]
name = "runnables"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anshaadk", email = "muhammedanshadmdi5@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arxiv==1.4.8",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "feedparser>=6.0.14",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=2.0",
    "pypdf>=6.21.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "tiktoken>=0.14.0",
]

[project.scripts]
runnables = "runnables:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
